services:
  nextcloud:
    image: ${IMAGE_NAME:?Set IMAGE_NAME to your Docker Hub image tag}
    ports: ["${NEXTCLOUD_PORT:-8080}:80"]
    environment:
      MYSQL_HOST: db
      MYSQL_DATABASE: ${MYSQL_DATABASE:-nextcloud}
      MYSQL_USER: ${MYSQL_USER:-nextcloud}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER:-admin}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD:?Set NEXTCLOUD_ADMIN_PASSWORD}
      NEXTCLOUD_TRUSTED_DOMAINS: ${NEXTCLOUD_TRUSTED_DOMAINS:?Set NEXTCLOUD_TRUSTED_DOMAINS}
      NGSIGN_BASE_URL: ${NGSIGN_BASE_URL:-https://sandbox.ng-sign.com/server}
      NGSIGN_API_TOKEN: ${NGSIGN_API_TOKEN:-}
    volumes: [nextcloud:/var/www/html]
    depends_on: {db: {condition: service_healthy}}
    restart: unless-stopped
  cron:
    image: ${IMAGE_NAME:?Set IMAGE_NAME to your Docker Hub image tag}
    entrypoint: /cron.sh
    volumes: [nextcloud:/var/www/html]
    depends_on: [nextcloud]
    restart: unless-stopped
  db:
    image: mariadb:11.4
    command: --transaction-isolation=READ-COMMITTED --binlog-format=ROW
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-nextcloud}
      MYSQL_USER: ${MYSQL_USER:-nextcloud}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
    volumes: [db:/var/lib/mysql]
    healthcheck: {test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"], interval: 10s, timeout: 5s, retries: 10}
    restart: unless-stopped
volumes: {nextcloud: {}, db: {}}
